# ==========================================================
# AntiHeight — конфиг зон эффектов, исключений и предметов
# ==========================================================

# Как часто (в тиках) проверять игроков и накладывать эффекты.
# 20 тиков = 1 секунда.
check-interval-ticks: 20

# Игроки-исключения (ники), на которых НИКАКИЕ эффекты плагина не действуют,
# независимо от масок и высоты.
exempt-players:
  - "ExampleNick1"
  - "ExampleNick2"

# ==========================================================
# ЗОНЫ ЭФФЕКТОВ
# Каждая зона: мир, диапазон Y, список эффектов, предмет-иммунитет.
# Если игрок попадает в диапазон Y данной зоны и НЕ носит указанный
# предмет-иммунитет (или "none" — тогда иммунитета нет вообще),
# ему накладываются перечисленные эффекты.
# ==========================================================
zones:

  # Зона "высота" в оверворлде — существующая механика (замена command blocks)
  overworld_height:
    enabled: true
    world: "world"
    min-y: 45
    max-y: 1000
    # immunity-item: какой кастомный предмет в слоте головы освобождает от эффектов зоны.
    # Варианты: "height_mask" (маска от высоты), "nether_helmet" (незерский шлем), "none"
    immunity-item: "height_mask"
    effects:
      - type: POISON
        amplifier: 5      # 0 = уровень I
        duration-seconds: 8
      - type: DARKNESS
        amplifier: 0
        duration-seconds: 8
      - type: NAUSEA
        amplifier: 0
        duration-seconds: 8
      - type: WITHER
        amplifier: 6
        duration-seconds: 8

  # Зона "жара" в Нижнем мире — новая механика
  nether_heat:
    enabled: true
    world: "world_nether"
    min-y: -64
    max-y: 320
    immunity-item: "nether_helmet"
    effects:
      - type: WITHER
        amplifier: 1
        duration-seconds: 8
      - type: HUNGER
        amplifier: 1
        duration-seconds: 8

# ==========================================================
# ПРЕДМЕТЫ
# texture-value — это base64-строка текстуры головы (Mojang textures API).
# Пока указаны заглушки/пустые — заменить, когда будут готовы текстуры.
# ==========================================================
items:

  height_mask:
    display-name: "&bПротивогазная маска"
    lore:
      - "&7Защищает от эффектов на большой высоте"
    # Base64 texture value с сайта типа minecraft-heads.com.
    # Оставь пустым '' чтобы использовать текстуру головы игрока по умолчанию.
    texture-value: ""

  nether_helmet:
    display-name: "&cНезерский шлем"
    lore:
      - "&7Защищает от жары в Нижнем мире"
    texture-value: ""
